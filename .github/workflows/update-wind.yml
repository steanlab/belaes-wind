# Раз в час собирает сетку ветра с Open-Meteo и кладет ее в ветку data (один коммит, история не растет).
# Страница читает файл wind-grid.json из этой ветки. Если файла нет или он старше 3 часов,
# страница сама запрашивает Open-Meteo, так что без этого workflow сайт тоже работает.
name: Update wind grid

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-wind
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch wind grid
        run: node tools/fetch-wind.js out/wind-grid.json

      - name: Publish to data branch
        working-directory: out
        run: |
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wind-grid.json
          git commit -q -m "Wind grid $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
